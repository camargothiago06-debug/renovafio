<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renova Fio | Fórmula Capilar para queda de cabelo</title>
<meta name="description" content="Fórmula Capilar Renova Fio: uma cápsula por dia para tratar a queda, renovar os fios e elevar a confiança. Linhas masculina e feminina.">
<meta name="theme-color" content="#0B3B3C">
<meta property="og:title" content="Renova Fio | Fórmula Capilar para queda de cabelo">
<meta property="og:description" content="Uma cápsula por dia para tratar a queda, renovar os fios e elevar a confiança.">
<meta property="og:type" content="website">
<meta property="og:image" content="/img/og-renova-fio.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:'Inter Tight','Inter',Arial,sans-serif;text-wrap:balance;font-feature-settings:"ss01","cv11"}
p,li,summary,span,a,button,td,th{font-feature-settings:"cv11","ss01"}
p{text-wrap:pretty}
a{color:#0B3B3C}a:hover{color:#0A2F2A}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details[open] .rf-plus{transform:rotate(45deg)}

/* ===== Banner animado (efeito de vídeo curto) ===== */
@keyframes rf-aurora1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes rf-aurora2{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(10%,-8%) scale(.95)}100%{transform:translate(0,0) scale(1.1)}}
@keyframes rf-draw{0%{stroke-dashoffset:1400;opacity:0}12%{opacity:.9}55%{stroke-dashoffset:0;opacity:.9}85%{opacity:.25}100%{stroke-dashoffset:-1400;opacity:0}}
@keyframes rf-rise{0%{opacity:0;transform:translateY(26px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes rf-fade{0%{opacity:0}100%{opacity:1}}
@keyframes rf-sceneA{0%{opacity:0}5%{opacity:1}45%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes rf-sceneB{0%{opacity:0}48%{opacity:0}55%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes rf-jar{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(-2deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes rf-shadow{0%{transform:scale(1);opacity:.55}50%{transform:scale(.86);opacity:.35}100%{transform:scale(1);opacity:.55}}
@keyframes rf-cap0{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-10px,-22px) rotate(-8deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes rf-cap1{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-16px,14px) rotate(7deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes rf-cap2{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(12px,-16px) rotate(-10deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes rf-push{0%{transform:scale(1) translateY(10px)}100%{transform:scale(1.09) translateY(-6px)}}
@keyframes rf-sweep{0%{transform:translateX(-140%) skewX(-18deg)}60%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes rf-kenburns{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.14) translate(-3%,-2%)}}
@keyframes rf-progress{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rf-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,130,114,.55)}50%{box-shadow:0 0 0 12px rgba(255,130,114,0)}}

.rf-a1{animation:rf-aurora1 16s ease-in-out infinite}
.rf-a2{animation:rf-aurora2 19s ease-in-out infinite}
.rf-line{stroke-dasharray:1400;animation:rf-draw 9s ease-in-out infinite}
.rf-line.l2{animation-delay:1.2s}.rf-line.l3{animation-delay:2.4s}.rf-line.l4{animation-delay:3.6s}
.rf-word{display:inline-block;opacity:0;animation:rf-rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.rf-in{opacity:0;animation:rf-rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.rf-sceneA{animation:rf-sceneA 14s ease-in-out infinite}
.rf-sceneB{animation:rf-sceneB 14s ease-in-out infinite}
.rf-jar{animation:rf-jar 5s ease-in-out infinite}
.rf-shadow{animation:rf-shadow 5s ease-in-out infinite}
.rf-cap0{animation:rf-cap0 4.2s ease-in-out infinite}
.rf-cap1{animation:rf-cap1 5.4s ease-in-out infinite}
.rf-cap2{animation:rf-cap2 4.8s ease-in-out infinite}
.rf-push{animation:rf-push 7s ease-out infinite alternate}
.rf-sweep{animation:rf-sweep 7s ease-in-out infinite}
.rf-kb{animation:rf-kenburns 7s ease-out infinite alternate}
.rf-progress{transform-origin:left;animation:rf-progress 7s linear infinite}
.rf-cta{animation:rf-pulse 2.6s ease-in-out infinite}
.rf-cta:hover{filter:brightness(1.05)}

/* Evolução masculina: 4 quadros em 16s (antes/depois de 2 clientes) */
@keyframes rf-spin{0%{transform:rotate(0deg) scale(1.04)}50%{transform:rotate(180deg) scale(1.1)}100%{transform:rotate(360deg) scale(1.04)}}
@keyframes rf-frame{0%{opacity:0}3%{opacity:1}25%{opacity:1}28%{opacity:0}100%{opacity:0}}
@keyframes rf-ring{0%{stroke-dashoffset:100}92%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes rf-seg0{0%{transform:scaleX(0)}25%,99%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes rf-seg1{0%,25%{transform:scaleX(0)}50%,99%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes rf-seg2{0%,50%{transform:scaleX(0)}75%,99%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes rf-seg3{0%,75%{transform:scaleX(0)}99%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.rf-spin{animation:rf-spin 32s linear infinite}
.rf-frame{opacity:0;animation:rf-frame 16s ease-in-out infinite}
.rf-frame.f0{animation-delay:-0.5s}.rf-frame.f1{animation-delay:-12.5s}.rf-frame.f2{animation-delay:-8.5s}.rf-frame.f3{animation-delay:-4.5s}
.rf-ring{stroke-dasharray:100;animation:rf-ring 4s ease-in-out infinite}
.rf-seg{transform-origin:left;transform:scaleX(0)}
.rf-seg.s0{animation:rf-seg0 16s linear infinite}.rf-seg.s1{animation:rf-seg1 16s linear infinite}.rf-seg.s2{animation:rf-seg2 16s linear infinite}.rf-seg.s3{animation:rf-seg3 16s linear infinite}

/* Logo: brilho dourado passando de tempos em tempos */
@keyframes rf-logo-shine{0%,62%{background-position:-160% 0}100%{background-position:260% 0}}
.rf-logo-shine{-webkit-mask-image:url(/img/logo-renova-fio.png);mask-image:url(/img/logo-renova-fio.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;background-image:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,246,214,0.95) 50%,rgba(255,255,255,0) 65%);background-size:60% 100%;background-repeat:no-repeat;background-position:-160% 0;animation:rf-logo-shine 6s ease-in-out infinite 1s}

/* Cabeçalho compacto no celular */
@media (max-width: 760px){
  .rf-navlink{display:none}
  .rf-logo{height:40px !important}
  .rf-navcta{padding:10px 16px !important;font-size:13px}
  .rf-tabs{order:3;width:100%;justify-content:center}
  .rf-tabs button{flex:1}
}

@media (prefers-reduced-motion: reduce){
  .rf-logo-shine{animation:none}
  .rf-spin,.rf-ring,.rf-seg{animation:none}
  .rf-frame{animation:none}.rf-frame.f1{opacity:1}
  .rf-a1,.rf-a2,.rf-line,.rf-jar,.rf-shadow,.rf-cap0,.rf-cap1,.rf-cap2,.rf-push,.rf-sweep,.rf-kb,.rf-progress,.rf-cta{animation:none}
  .rf-word,.rf-in{animation:none;opacity:1}
  .rf-sceneA{animation:none;opacity:1}.rf-sceneB{animation:none;opacity:0}
}
</style>
<style>html{scroll-behavior:smooth}*,*::before,*::after{box-sizing:border-box}img{max-width:100%}</style>
</head>
<body>
<div id="rf-root"></div>
<template id="rf-template">
<div style="font-family: 'Inter', Arial, sans-serif; color: #0B3B3C; background: #FFFFFF; width: 100%; min-width: 0">

<!-- Cabeçalho -->
<header style="position: sticky; top: 0; z-index: 20; background: #FFFFFF; border-bottom: 1px solid #E3EAE8">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="#" class="rf-logo" aria-label="Renova Fio — início" style="display: block; height: 58px; aspect-ratio: 770 / 264; position: relative">
<img src="/img/logo-renova-fio.png" alt="Renova Fio" style="height: 100%; width: auto; display: block; filter: drop-shadow(0 1px 1px rgba(122,92,42,0.25))">
<span class="rf-logo-shine" aria-hidden="true" style="position: absolute; inset: 0"></span>
</a>
<nav aria-label="Linha de tratamento" class="rf-tabs" style="display: flex; gap: 4px; background: #F1F4F3; border-radius: 999px; padding: 4px">
<button type="button" aria-pressed="{{isFem}}" onClick="{{showFem}}" style="{{tabFemStyle}}">Feminino</button>
<button type="button" aria-pressed="{{isMasc}}" onClick="{{showMasc}}" style="{{tabMascStyle}}">Masculino</button>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; font-size: 14px; font-weight: 600">
<a href="#como-funciona" class="rf-navlink" style="text-decoration: none; color: #0B3B3C">Como funciona</a>
<a href="#resultados" class="rf-navlink" style="text-decoration: none; color: #0B3B3C">Resultados</a>
<a href="#duvidas" class="rf-navlink" style="text-decoration: none; color: #0B3B3C">Dúvidas</a>
<a href="#comecar" class="rf-navcta" style="text-decoration: none; background: #FF8272; color: #0B3B3C; padding: 12px 22px; border-radius: 999px; font-weight: 700">Começar agora</a>
</div>
</div>
</header>

<!-- Barra de oferta com contagem regressiva -->
<div style="background: #0B3B3C; color: #FFFFFF; padding: 10px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 18px; text-align: center">
<span style="font-size: 14px; font-weight: 600">[X]% OFF no 1º pedido termina em:</span>
<div role="timer" aria-label="Tempo restante da oferta" style="display: flex; gap: 10px; align-items: center">
<div style="display: flex; flex-direction: column; align-items: center; min-width: 40px"><strong style="font-size: 20px; line-height: 1.1"><span data-cd="hh">00</span></strong><span style="font-size: 11px; color: #B9D1CC">Horas</span></div>
<span style="color: #9FE4B2; font-weight: 700" aria-hidden="true">:</span>
<div style="display: flex; flex-direction: column; align-items: center; min-width: 40px"><strong style="font-size: 20px; line-height: 1.1"><span data-cd="mm">00</span></strong><span style="font-size: 11px; color: #B9D1CC">Minutos</span></div>
<span style="color: #9FE4B2; font-weight: 700" aria-hidden="true">:</span>
<div style="display: flex; flex-direction: column; align-items: center; min-width: 40px"><strong style="font-size: 20px; line-height: 1.1"><span data-cd="ss">00</span></strong><span style="font-size: 11px; color: #B9D1CC">Segundos</span></div>
</div>
</div>

<!-- HERO: banner animado -->
<section style="padding: 20px 16px 0; background: #FFFFFF">
<div style="max-width: 1280px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 28px; background: radial-gradient(ellipse at 75% 35%, #145452 0%, #0C3C3C 42%, #0A2F2A 72%, #111414 100%); color: #FFFFFF">

<!-- camadas de fundo em movimento -->
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<div class="rf-a1" style="position: absolute; width: 60%; height: 80%; left: 45%; top: -10%; border-radius: 50%; background: radial-gradient(circle, rgba(159,228,178,0.22) 0%, rgba(159,228,178,0) 65%)"></div>
<div class="rf-a2" style="position: absolute; width: 55%; height: 70%; left: -10%; top: 45%; border-radius: 50%; background: radial-gradient(circle, rgba(255,130,114,0.16) 0%, rgba(255,130,114,0) 65%)"></div>
<svg viewBox="0 0 1280 640" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%">
<path class="rf-line" d="M-40 470 C 260 330, 520 610, 820 420 S 1180 250, 1340 330" fill="none" stroke="#9FE4B2" stroke-width="1.2" stroke-opacity="0.55"></path>
<path class="rf-line l2" d="M-40 500 C 280 360, 540 640, 840 450 S 1190 280, 1340 360" fill="none" stroke="#D6C08F" stroke-width="1" stroke-opacity="0.6"></path>
<path class="rf-line l3" d="M-40 530 C 300 390, 560 660, 860 480 S 1200 310, 1340 390" fill="none" stroke="#9FE4B2" stroke-width="0.8" stroke-opacity="0.45"></path>
<path class="rf-line l4" d="M-40 560 C 320 420, 580 690, 880 510 S 1210 340, 1340 420" fill="none" stroke="#D6C08F" stroke-width="0.8" stroke-opacity="0.45"></path>
</svg>
</div>

<div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: clamp(32px, 5vw, 64px) clamp(24px, 5vw, 64px) 0">

<!-- texto -->
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px; padding-bottom: 40px">
<span class="rf-in" style="align-self: flex-start; animation-delay: .1s; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0B3B3C; background: #9FE4B2; border-radius: 999px; padding: 7px 14px">{{c.eyebrow}}</span>
<h1 style="margin: 0; font-weight: 600; font-size: clamp(40px, 5.4vw, 68px); line-height: 1.04; letter-spacing: -0.035em; color: #FFFFFF">
<template data-sc="for" list="{{c.titleWords}}" as="w"><span class="rf-word" style="{{w.style}}">{{w.t}}</span> </template>
</h1>
<p class="rf-in" style="margin: 0; animation-delay: .9s; font-size: 20px; font-weight: 600; color: #FFFFFF">+[NÚMERO] {{c.statLabel}} já começaram.</p>
<ul class="rf-in" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; animation-delay: 1.1s">
<template data-sc="for" list="{{c.bullets}}" as="b">
<li style="display: flex; align-items: center; gap: 12px; font-size: 16px; color: #E7F0EE">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#9FE4B2"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#0B3B3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{b}}
</li>
</template>
</ul>
<div class="rf-in" style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; animation-delay: 1.35s">
<a href="#comecar" class="rf-cta" style="text-decoration: none; background: #FF8272; color: #0B3B3C; padding: 18px 34px; border-radius: 999px; font-weight: 700; font-size: 16px; letter-spacing: .02em; text-transform: uppercase">{{c.cta}}</a>
<a href="#como-funciona" style="text-decoration: none; color: #FFFFFF; padding: 16px 8px; font-weight: 600; font-size: 15px">Ver como funciona →</a>
</div>
<div class="rf-in" style="display: flex; flex-wrap: wrap; gap: 14px 28px; animation-delay: 1.6s; font-size: 13px; color: #CFE0DC">
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9FE4B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>[X]% de desconto no 1º pedido</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9FE4B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 11h18M9 7V4h6v3"></path></svg>Entrega em casa</span>
</div>
</div>

<!-- palco animado -->
<div aria-hidden="true" style="flex: 1 1 420px; min-width: 0; position: relative; height: clamp(400px, 46vw, 580px)">

<template data-sc="if" value="{{isMasc}}">
<!-- Evolução girando: antes e depois de clientes reais -->
<div style="position: absolute; inset: 0 0 44px 0; display: flex; align-items: center; justify-content: center">
<div style="position: relative; height: 100%; max-width: 100%; aspect-ratio: 1 / 1">

<!-- anel de progresso -->
<svg viewBox="0 0 200 200" style="position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg)">
<circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"></circle>
<circle class="rf-ring" cx="100" cy="100" r="96" fill="none" stroke="#9FE4B2" stroke-width="2.5" stroke-linecap="round" pathLength="100"></circle>
</svg>

<!-- cabeça girando -->
<div style="position: absolute; inset: 5%; border-radius: 50%; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.15)">
<div class="rf-spin" style="position: absolute; inset: 0">
<img class="rf-frame f0" src="/img/cliente1-antes.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<img class="rf-frame f1" src="/img/cliente1-depois.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<img class="rf-frame f2" src="/img/cliente2-antes.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<img class="rf-frame f3" src="/img/cliente2-depois.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</div>
<div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 55%, rgba(10,47,42,0.45) 100%)"></div>
</div>

<!-- etiqueta da fase -->
<div style="position: absolute; left: 50%; bottom: 1%; transform: translateX(-50%); width: 190px; height: 40px">
<span class="rf-frame f0" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #0B3B3C; font-size: 14px; font-weight: 700">Antes · Dia 01</span>
<span class="rf-frame f1" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #9FE4B2; color: #0B3B3C; font-size: 14px; font-weight: 700">Depois · 3 meses</span>
<span class="rf-frame f2" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #0B3B3C; font-size: 14px; font-weight: 700">Antes · Dia 01</span>
<span class="rf-frame f3" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #9FE4B2; color: #0B3B3C; font-size: 14px; font-weight: 700">Depois · 11 meses</span>
</div>

<!-- frasco flutuando ao lado -->
<div class="rf-jar" style="position: absolute; right: -14%; bottom: 4%; width: 30%">
<img src="/img/frasco-masculino.webp" alt="" style="width: 100%; display: block; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5))">
</div>
</div>
</div>

<!-- segmentos estilo stories + aviso -->
<div style="position: absolute; left: 10%; right: 10%; bottom: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center">
<div style="width: 100%; display: flex; gap: 6px">
<div style="flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden"><div class="rf-seg s0" style="height: 100%; background: #9FE4B2"></div></div>
<div style="flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden"><div class="rf-seg s1" style="height: 100%; background: #9FE4B2"></div></div>
<div style="flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden"><div class="rf-seg s2" style="height: 100%; background: #9FE4B2"></div></div>
<div style="flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden"><div class="rf-seg s3" style="height: 100%; background: #9FE4B2"></div></div>
</div>
<span style="font-size: 11px; color: #B9D1CC">Clientes reais. Resultados individuais podem variar.</span>
</div>
</template>

<template data-sc="if" value="{{isFem}}">
<!-- Imagem fixa: kit feminino na caixa -->
<div style="position: absolute; inset: 0 0 40px 0; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: min(100%, 440px); height: 92%; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.4)">
<img src="/img/kit-feminino.webp" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
</div>
</template>
</div>
</div>
</div>
</section>

<!-- Selos -->
<section style="padding: 28px 24px; background: #FFFFFF">
<div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; font-size: 15px; font-weight: 600; color: #0B3B3C">

<script>
(function () {
  'use strict';
  var RE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function resolve(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function whole(str) { var m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str || ''); return m ? m[1] : null; }
  function interp(str, scope) { return str.replace(RE, function (_, p) { var v = resolve(p, scope); return v == null ? '' : String(v); }); }

  function proc(node, scope) {
    var kids = Array.prototype.slice.call(node.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.nodeType === 3) { if (el.nodeValue.indexOf('{{') > -1) el.nodeValue = interp(el.nodeValue, scope); continue; }
      if (el.nodeType !== 1) continue;
      var kind = el.tagName === 'TEMPLATE' ? el.getAttribute('data-sc') : null;
      if (kind === 'for') {
        var list = resolve(whole(el.getAttribute('list')) || '', scope) || [];
        var as = el.getAttribute('as') || 'item';
        var frag = document.createDocumentFragment();
        for (var j = 0; j < list.length; j++) {
          var s = Object.create(scope); s[as] = list[j]; s.$index = j;
          var f = el.content.cloneNode(true); proc(f, s); frag.appendChild(f);
        }
        el.parentNode.replaceChild(frag, el); continue;
      }
      if (kind === 'if') {
        if (resolve(whole(el.getAttribute('value')) || 'false', scope)) {
          var g = el.content.cloneNode(true); proc(g, scope); el.parentNode.replaceChild(g, el);
        } else { el.parentNode.removeChild(el); }
        continue;
      }
      var attrs = Array.prototype.slice.call(el.attributes);
      for (var a = 0; a < attrs.length; a++) {
        var n = attrs[a].name, val = attrs[a].value;
        if (val.indexOf('{{') < 0) continue;
        if (n.slice(0, 2) === 'on') {
          el.removeAttribute(n);
          var fn = resolve(whole(val) || '', scope);
          if (typeof fn === 'function') el.addEventListener(n.slice(2), fn);
        } else { el.setAttribute(n, interp(val, scope)); }
      }
      if (el.tagName === 'TEMPLATE') continue;
      proc(el, scope);
    }
  }

  var tpl = document.getElementById('rf-template');
  var root = document.getElementById('rf-root');
  var params = new URLSearchParams(location.search);
  var linha = (params.get('linha') || location.hash.replace('#', '')).toLowerCase();
  var props = { startTab: linha === 'feminino' ? 'Feminino' : 'Masculino' };
  var comp = new Component(props);

  window.render = function () {
    var vals = comp.renderVals();
    var frag = tpl.content.cloneNode(true);
    proc(frag, vals);
    root.replaceChildren(frag);
    tick();
  };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date(), end = new Date(d); end.setHours(24, 0, 0, 0);
    var left = Math.max(0, Math.floor((end - d) / 1000));
    var v = { hh: pad(Math.floor(left / 3600)), mm: pad(Math.floor((left % 3600) / 60)), ss: pad(left % 60) };
    var els = root.querySelectorAll('[data-cd]');
    for (var i = 0; i < els.length; i++) els[i].textContent = v[els[i].getAttribute('data-cd')];
  }
  render();
  setInterval(tick, 1000);
})();
</script>
